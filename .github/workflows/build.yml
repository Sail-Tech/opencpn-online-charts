name: Build OpenCPN import packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake g++ make gettext libwxgtk3.2-dev libcurl4-openssl-dev libgl1-mesa-dev libglu1-mesa-dev file ca-certificates
      - name: Build import tarball
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DOCPN_TARGET_TUPLE=debian-x86_64;12;x86_64'
          cmake --build build --target tarball --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: OnlineCharts-Linux-x86_64
          path: |
            build/*.tar.gz
            build/*.xml
            build/*.sha256

  raspberry-pi:
    # Raspberry Pi OS (Pi 3 and later), 32-bit (armhf) and 64-bit (arm64), on Bookworm
    # (Debian 12) and Trixie (Debian 13). OpenCPN accepts a debian-* package only when
    # its Debian major version is the host's, so each release needs its own package.
    # arm64 builds natively on an Arm runner; armhf runs under QEMU on x86-64.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { debian: 12, arch: armhf, platform: linux/arm/v7, runner: ubuntu-24.04 }
          - { debian: 12, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { debian: 13, arch: armhf, platform: linux/arm/v7, runner: ubuntu-24.04 }
          - { debian: 13, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build import tarball
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ID \
            -v "$PWD:/src" -w /src debian:${{ matrix.debian }} bash -ec '
              apt-get update
              apt-get install -y --no-install-recommends cmake g++ make gettext git libwxgtk3.2-dev libcurl4-openssl-dev libgl1-mesa-dev libglu1-mesa-dev file ca-certificates
              git config --global --add safe.directory /src
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DOCPN_TARGET_TUPLE=debian-${{ matrix.arch }};${{ matrix.debian }};${{ matrix.arch }}"
              cmake --build build --target tarball --parallel $(nproc)
              find build -name "*.so" -path "*lib/opencpn*" -exec file {} +'
      - uses: actions/upload-artifact@v4
        with:
          name: OnlineCharts-RaspberryPi-debian${{ matrix.debian }}-${{ matrix.arch }}
          path: |
            build/*.tar.gz
            build/*.xml
            build/*.sha256

  windows:
    # build-windows.bat uses the Visual Studio 2022 generator. x64 is for the
    # 64-bit OpenCPN 5.14+, Win32 for the 32-bit OpenCPN 5.8-5.12.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            name: x86_64
          - platform: Win32
            name: x86
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Build import tarball
        shell: cmd
        run: ci\build-windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: OnlineCharts-Windows-${{ matrix.name }}
          path: |
            build/*.tar.gz
            build/*.xml
            build/*.sha256

  macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew install cmake gettext
          curl -fL https://dl.cloudsmith.io/public/nohal/opencpn-plugins/raw/files/macos_deps_universal.tar.xz -o /tmp/macos_deps_universal.tar.xz
          sudo tar -C /usr/local -xJf /tmp/macos_deps_universal.tar.xz
      - name: Build universal import tarball
        run: |
          export PATH="/usr/local/bin:$(brew --prefix gettext)/bin:$PATH"
          export WX_CONFIG=/usr/local/lib/wx/config/osx_cocoa-unicode-3.2
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            "-DOCPN_TARGET_TUPLE=darwin-wx32;10;universal"
          cmake --build build --target tarball --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: OnlineCharts-macOS-universal
          path: |
            build/*.tar.gz
            build/*.xml
            build/*.sha256
